server:
  # Render cap PORT qua bien moi truong; mac dinh 8080 khi chay local.
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  data:
    mongodb:
      # Connection string MongoDB Atlas. Dat qua bien moi truong MONGODB_URI tren Render.
      # Vi du: mongodb+srv://user:pass@cluster0.xxxxx.mongodb.net/ParkingDB?retryWrites=true&w=majority
      uri: ${MONGODB_URI:mongodb://localhost:27017/ParkingDB}
      # Tu tao index tu annotation @Indexed (unique username/email/...).
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtps
    properties:
      mail:
        # Timeout 5s: khi mail chua cau hinh / sai App Password, request gui OTP BAO LOI NHANH
        # thay vi treo vo han (lam ket nut "Dang gui ma..." o FE va can thread tren Render free).
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            enable: true
          starttls:
            enable: true
        smtps:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Gui email OTP qua SendGrid API (HTTPS) — Render chan SMTP nen khong dung spring.mail nua.
sendgrid:
  api-key: ${SENDGRID_API_KEY:}
mail:
  # Email nguoi gui PHAI da xac minh trong SendGrid (Single Sender Verification).
  sender-email: ${MAIL_SENDER:}
  sender-name: ${MAIL_SENDER_NAME:Parking System}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs

app:
  # URL goc cua FE, dung de dung link dat lai mat khau trong email.
  frontend-base-url: ${APP_FRONTEND_BASE_URL:https://fe-kappa-two.vercel.app}
  cors:
    # Danh sach origin FE duoc phep (phan cach bang dau phay). KHONG dung "*" o production.
    # parking-driver va parking-fe da deploy len Vercel; giu ca localhost de dev local van chay.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,https://parking-driver.vercel.app,https://fe-kappa-two.vercel.app}
  jwt:
    secret: ${APP_JWT_SECRET:change-this-secret-to-a-long-random-string-in-production-min-32-chars}
    # 8h. JWT stateless nen khong the thu hoi truoc han — vong doi du dai de phien lam viec
    # trong ngay khong het han giua chung, van gioi han cua so rui ro neu token bi lo
    # (logout chi xoa token phia client). Chinh qua APP_JWT_EXPIRATION_MS.
    expiration-ms: ${APP_JWT_EXPIRATION_MS:28800000}

payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  # PHAI tro ve /driver/payment/return — trang nay goi confirm-deposit (verify voi PayOS) de flip
  # reservation Pending -> Confirmed va danh dau Payment = Success. Neu tro thang ve /driver/my-bookings
  # thi buoc xac nhan bi BO QUA, coc ket o Pending mai (webhook PayOS khong goi duoc vao localhost).
  # parking-driver da deploy len Vercel nen tro thang ve domain do; doi lai localhost:3001 neu test local.
  return-url: ${PAYOS_RETURN_URL:https://parking-driver.vercel.app/driver/payment/return}
  cancel-url: ${PAYOS_CANCEL_URL:https://parking-driver.vercel.app/driver/payment/return?cancel=true}
